<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dartsportz</title>
<meta name="theme-color" content="#0f0f10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Dartsportz">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>:root{
  --bg:#0f0f10; --bg2:#18181a; --card:#222225; --card2:#2c2c30; --line:#38383d;
  --txt:#f4f4f5; --mut:#a1a1aa; --dim:#71717a;
  --or:#ff6b00; --or2:#ff9233; --or3:#ffb46b; --ok:#22c55e; --bad:#ef4444;
  --r:16px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
input,select,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.bb{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.5px;font-weight:400}
#app{max-width:820px;margin:0 auto;width:100%;min-height:100%;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.top{display:flex;align-items:center;gap:10px;padding:12px 12px 6px;position:sticky;top:0;background:linear-gradient(var(--bg) 70%,transparent);z-index:5}
.top h1{flex:1;margin:0;text-align:center;font-size:34px;line-height:1}
.top .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);font-size:20px}
.top .ic.ghost{background:none}
.view{flex:1;padding:6px 12px calc(96px + var(--safe-b))}
.nav{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(90deg,#3a1a08,#151517 45%);border-top:1px solid #2a2a2e;padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:center;z-index:20}
.nav .in{display:flex;max-width:820px;width:100%;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 8px;border-radius:12px;min-width:60px;position:relative}
.nav button svg{width:26px;height:26px}
.nav button.on{color:var(--txt)}
.nav button.on::before{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--or)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.tile{border-radius:20px;padding:18px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;position:relative;overflow:hidden}
.tile h3{margin:0;font-size:34px;line-height:.92}
.tile p{margin:8px 0 0;font-size:13.5px;opacity:.92;line-height:1.3}
.tile .em{position:absolute;right:12px;bottom:10px;font-size:30px;opacity:.35}
.tile h3{position:relative;z-index:1}
.t-or{background:linear-gradient(135deg,#ff6b00,#e04e00)}
.t-or2{background:linear-gradient(135deg,#ff9a2e,#e67800);color:#1b1b1b}
.t-dk{background:linear-gradient(135deg,#26262a,#1b1b1e);border:1px solid #333}
.t-gr{background:linear-gradient(135deg,#3a3a40,#232327)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.mut{color:var(--mut)} .dim{color:var(--dim)} .sm{font-size:13px} .xs{font-size:11.5px}
.btn{background:var(--or);color:#fff;border-radius:999px;padding:15px 20px;font-weight:700;font-size:17px;width:100%;text-align:center}
.btn.sec{background:var(--card2);color:var(--txt)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:9px 14px;font-size:14px;width:auto}
.btn:active,.key:active,.chip:active{transform:scale(.97)}
.seg{display:flex;background:#141416;border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;padding:12px 6px;border-radius:11px;font-weight:600;color:var(--mut);font-size:14.5px}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:0 2px 6px #0006}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px;font-weight:700}
.sec-h{display:flex;align-items:center;gap:10px;margin:4px 0 10px}
.sec-h h2{margin:0;font-size:28px;flex:1}
.q{width:30px;height:30px;border-radius:50%;background:var(--or2);color:#111;font-weight:800;display:grid;place-items:center;font-size:16px}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{width:100%;background:#141416;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-size:16px;font-family:inherit}
input[type=range]{width:100%;accent-color:var(--or)}
input[type=color]{width:44px;height:36px;border:0;border-radius:10px;background:none;padding:0}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.chips{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:76px;position:relative}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:24px;color:#111;position:relative;flex:none;background-size:cover;background-position:center}
.av.s{width:38px;height:38px;font-size:15px}
.av.xs{width:28px;height:28px;font-size:12px}
.pl .x{position:absolute;top:44px;left:46px;width:24px;height:24px;border-radius:50%;background:#000;color:#fff;font-size:13px;display:grid;place-items:center;border:2px solid var(--card)}
.pl .cfg{position:absolute;top:-2px;left:46px;width:24px;height:24px;border-radius:50%;background:var(--or);color:#fff;font-size:13px;display:grid;place-items:center}
.pl .nm{font-weight:600;font-size:14px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.add{width:64px;height:64px;border-radius:50%;border:2px dashed #555;display:grid;place-items:center;font-size:28px;color:var(--mut)}
.stepper{display:flex;align-items:center;background:var(--or2);border-radius:16px;color:#111}
.stepper button{width:42px;height:46px;font-size:22px;font-weight:800}
.stepper b{min-width:34px;text-align:center;font-size:28px}
.switch{width:52px;height:30px;border-radius:30px;background:#3a3a40;position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch.on{background:var(--ok)}
.switch.on::after{left:25px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #2b2b2f}
.list .it:last-child{border:0}
.badge{background:var(--card2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.badge.or{background:var(--or);color:#fff}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:26px;font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.5px}
.stat span{font-size:12px;color:var(--mut)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:999px;font-weight:600;z-index:100;box-shadow:0 8px 24px #0008;animation:tin .25s;max-width:90%}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.modal-bg{position:fixed;inset:0;background:#000b;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fin .2s}
@keyframes fin{from{opacity:0}}
.modal{background:var(--bg2);width:100%;max-width:820px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding:10px 18px calc(20px + var(--safe-b));animation:sup .25s ease-out}
@keyframes sup{from{transform:translateY(40px)}}
.modal .grab{width:44px;height:5px;border-radius:5px;background:#555;margin:2px auto 10px}
.modal h2{font-size:30px;margin:4px 0 12px;text-align:center}
/* GAME */
.game{display:flex;flex-direction:column;height:100dvh;width:100%;max-width:820px;margin:0 auto;padding-top:var(--safe-t);overflow:hidden}
.g-top{display:flex;align-items:center;padding:8px 12px 4px;gap:8px}
.g-top h1{flex:1;text-align:center;margin:0;font-size:26px}
.g-top button{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:var(--card)}
.sides{display:flex;gap:6px;padding:4px 10px;overflow-x:auto}
.side{flex:1;min-width:104px;border-radius:16px;padding:8px 10px;background:var(--card);position:relative;transition:.2s}
.side.act{background:linear-gradient(135deg,#ff6b00,#e04e00)}
.side .nm{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.side .sc{font-family:"Bebas Neue",Impact,sans-serif;font-size:46px;line-height:1;margin-top:2px}
.side.act .sc{font-size:58px}
.side .lg{position:absolute;right:8px;top:8px;background:#000;border-radius:8px;padding:2px 8px;font-weight:800;font-size:14px}
.side .meta{font-size:11.5px;opacity:.9;display:flex;justify-content:space-between;gap:6px}
.side .co{font-size:12px;font-weight:800;margin-top:2px;background:#0004;border-radius:6px;padding:2px 6px;display:inline-block}
.who{font-family:"Bebas Neue",Impact,sans-serif;color:var(--or);font-size:24px;padding:2px 14px 0;display:flex;align-items:center;gap:8px}
.bwrap{flex:1 1 0;min-height:110px;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bwrap .bin{position:relative;width:200px;height:200px;flex:none}
.bwrap svg.board{width:100%;height:100%;display:block}
.fly{position:absolute;left:0;top:0;width:34px;height:150px;pointer-events:none;transform-origin:50% 0;z-index:3;will-change:transform}
.bubble{position:absolute;left:10px;right:10px;top:6px;background:#fff;color:#111;border-radius:14px;padding:8px 12px;font-size:13.5px;font-weight:600;z-index:4;box-shadow:0 6px 16px #0007;animation:tin2 .25s}
@keyframes tin2{from{opacity:0;transform:translateY(-6px)}}
.bubble small{display:block;color:var(--or);font-weight:800;font-size:11px;text-transform:uppercase}
.visit{display:flex;align-items:stretch;background:#fff;border-radius:999px;margin:6px 10px;height:54px;overflow:hidden;color:#111}
.visit .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #e5e5e5;line-height:1}
.visit .d b{font-family:"Bebas Neue",Impact,sans-serif;font-size:30px;font-weight:400}
.visit .d small{font-size:11.5px;font-weight:700;color:#555;margin-top:1px}
.visit .tot{flex:1.1;display:grid;place-items:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:30px}
.visit .sub{background:var(--ok);margin:5px;border-radius:999px;flex:1.3;font-weight:800;font-size:17px}
.pad{padding:0 10px calc(8px + var(--safe-b))}
.mrow{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid #2a2a2e}
.mrow button{padding:10px 2px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;line-height:1.1}
.mrow button.on{color:var(--txt);border-color:var(--or)}
.mrow button.d2.on{border-color:#22c55e} .mrow button.t3.on{border-color:#ef4444}
.keys{display:grid;grid-template-columns:repeat(5,1fr)}
.key{height:clamp(44px,6.4vh,60px);font-family:"Bebas Neue",Impact,sans-serif;font-size:32px;display:flex;align-items:center;justify-content:center;gap:5px;border-right:1px solid #232327;border-bottom:1px solid #232327}
.key:nth-child(5n){border-right:0}
.key small{font-family:Inter,sans-serif;font-size:12px;color:#8a8a93;font-weight:600}
.keys.dbl .key b{color:#4ade80;font-weight:400} .keys.tri .key b{color:#f87171;font-weight:400}
.brow{display:grid;grid-template-columns:1fr 1fr 1fr;height:52px}
.brow button{font-size:22px}
.brow .miss{font-family:"Bebas Neue",Impact,sans-serif;font-size:30px}
.wheel{width:260px;height:260px;margin:10px auto;position:relative}
.wheel svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.12,.75,.15,1)}
.wheel .ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #fff;z-index:2}
.drill-big{font-family:"Bebas Neue",Impact,sans-serif;font-size:110px;text-align:center;line-height:1;color:var(--or)}
.hitbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.hitbtns button{height:120px;border-radius:22px;font-size:22px;font-weight:800}
.hit{background:var(--ok);color:#06210f} .nohit{background:#3a1416;color:#fecaca;border:1px solid #7f1d1d}
.bar{height:8px;background:#2a2a2e;border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or)}
.chart{display:flex;align-items:flex-end;gap:3px;height:90px}
.chart i{flex:1;background:var(--or);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.chart i.w{background:var(--ok)}
.story{background:linear-gradient(135deg,#2a1608,#1a1a1d);border:1px solid #4a2a10;border-radius:18px;padding:14px;margin-bottom:12px}
.lvl{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--card);margin-bottom:8px}
.lvl.lock{opacity:.45}
.lvl .n{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:24px}
.lvl.done .n{background:var(--ok);color:#062}
.lvl.cur .n{background:var(--or);color:#fff}
.dartprev{background:radial-gradient(circle at 50% 40%,#2c2c30,#161618);border-radius:18px;display:flex;justify-content:center;padding:14px;margin-bottom:12px;overflow:hidden}
.dartprev.stick{position:sticky;top:calc(58px + var(--safe-t));z-index:6;box-shadow:0 10px 24px #000c;border:1px solid #2e2e33}
.dartprev svg{height:300px;width:auto;transform:rotate(-90deg);margin:-120px 0}
.photos{display:flex;gap:8px;overflow-x:auto}
.photos img{width:90px;height:90px;object-fit:cover;border-radius:12px}
.flag{font-size:18px}
.pulse{animation:pls 1.1s infinite}
@keyframes pls{50%{opacity:.25}}
.hm path{transition:fill .3s}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.logo{display:flex;align-items:center;gap:8px;justify-content:center;flex:1}
.logo b{font-family:"Bebas Neue",Impact,sans-serif;font-size:34px;letter-spacing:1px}
.logo b span{color:var(--or)}

#zoom{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#0008;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);opacity:0;transition:opacity .16s;pointer-events:none}
#zoom.on{opacity:1}
#zoom .zin{position:relative;width:min(96vw,64vh);height:min(96vw,64vh);transform:scale(.7);transition:transform .2s cubic-bezier(.2,.8,.3,1.2)}
#zoom.on .zin{transform:scale(1)}
#zoom .zlbl{position:absolute;left:0;right:0;bottom:-46px;text-align:center;font-family:"Bebas Neue",Impact,sans-serif;font-size:40px;color:#fff;text-shadow:0 2px 8px #000}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable td,.ptable th{padding:3px 4px;text-align:center}
.ptable .num{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px;color:var(--or)}
.ptable .cl{opacity:.35}
.mk{font-family:"Bebas Neue",Impact,sans-serif;font-size:22px}
.pside{flex:1;min-width:96px;border-radius:14px;padding:7px 9px;background:var(--card);position:relative}
.pside.act{background:linear-gradient(135deg,#ff6b00,#e04e00)}
.pside.out{opacity:.35}
.pside .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pside .big{font-family:"Bebas Neue",Impact,sans-serif;font-size:40px;line-height:1}
.pside .sub{font-size:11.5px;opacity:.9}
.lives{letter-spacing:1px;font-size:13px}
.chat-msg{max-width:80%;padding:9px 12px;border-radius:16px;margin:4px 0;background:var(--card2)}

.nb{position:absolute;top:0;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-style:normal;font-weight:800;display:none;place-items:center;padding:0 4px}
</style></head><body><div id="app"></div>
<script>'use strict';
/* ================= STORE ================= */
const LS_KEY = 'dartsportz_v1';
let mem = null;
const DEFAULT_SETTINGS = { anim: 'normal', sound: true, volume: 0.8, caller: 'de', botVoice: true, zoom: true, voiceDe: '', voiceEn: '', vibrate: true, boardSounds: {}, input: 'pad' };
function loadStore() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) {}
  d = d || {};
  d.players = d.players || [];
  d.teams = d.teams || [];
  d.matches = d.matches || [];
  d.training = d.training || [];
  d.career = d.career || { best: 0, results: {} };
  d.settings = Object.assign({}, DEFAULT_SETTINGS, d.settings || {});
  d.me = d.me || null;
  d.boardRot = d.boardRot || {};
  return d;
}
const S = loadStore();
let saveT = null;
function save(now) {
  clearTimeout(saveT);
  const w = () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('Speicher voll – bitte Fotos reduzieren'); } };
  if (now) w(); else saveT = setTimeout(w, 150);
}

/* ================= UTILS ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d = 2) => (isFinite(v) ? v : 0).toFixed(d);
function toast(msg, ms = 1800) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function vibrate(ms = 12) { if (S.settings.vibrate && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }
function modal(html, onMount) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><div class="grab"></div>${html}</div>`;
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg) close(); });
  document.body.appendChild(bg);
  onMount && onMount(bg.firstElementChild, close);
  return close;
}
function confirmBox(text, yes = 'Ja', no = 'Abbrechen') {
  return new Promise(res => {
    modal(`<h2 class="bb">${esc(text)}</h2><div class="grid2"><button class="btn sec" data-n>${no}</button><button class="btn" data-y>${yes}</button></div>`, (m, close) => {
      m.querySelector('[data-n]').onclick = () => { close(); res(false); };
      m.querySelector('[data-y]').onclick = () => { close(); res(true); };
    });
  });
}
function resizeImage(file, max = 640, q = 0.72) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', q));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
function pickFile(accept = 'image/*') {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.onchange = () => res(i.files[0] || null); i.click();
  });
}

      if (played) { t.legs++; if (leg.winner === si) { t.legsWon++; const sideDarts = leg.visits.filter(v => v.side === si).reduce((a, v) => a + v.darts.length, 0); const ld = m.sides[si].members.length === 1 ? legDarts : sideDarts; if (!t.bestLeg || ld < t.bestLeg) t.bestLeg = ld; } }
    }
    if (m.finished) { t.matches++; if (m.winner === si) t.wins++; else t.losses++; }
    if (md) t.avgs.push({ id: m.id, avg: mp / md * 3, won: m.winner === si, d: m.created });
  }
  t.avg = t.darts ? t.pts / t.darts * 3 : 0; t.f9 = t.f9d ? t.f9p / t.f9d * 3 : 0; t.co = t.att ? t.hit / t.att * 100 : 0;
  return t;
}
function matchAvg(m, pid) { let d = 0, p = 0; m.legs.forEach(l => l.visits.forEach(v => { if (v.pid === pid) { d += v.darts.length; p += v.bust ? 0 : v.scored; } })); return d ? p / d * 3 : 0; }
function h2h(pid) {
  const res = {};
  for (const m of S.matches) {
    if (!m.finished || m.mode !== 'x01' || m.sides.length !== 2) continue;
    const si = m.sides.findIndex(sd => sd.members.includes(pid)); if (si < 0) continue;
    const o = m.sides[1 - si]; if (o.members.length !== 1 || m.sides[si].members.length !== 1) continue;
    const oid = o.bot ? 'bot:' + o.bot.level : o.members[0];
    const r = res[oid] = res[oid] || { w: 0, l: 0, games: [] };
    if (m.winner === si) r.w++; else r.l++;
    r.games.push({ m, won: m.winner === si, my: matchAvg(m, pid), op: matchAvg(m, o.members[0]), score: `${m.settings.unit === 'sets' ? m.setsWon[si] : m.legsWon[si]}:${m.settings.unit === 'sets' ? m.setsWon[1 - si] : m.legsWon[1 - si]}` });
  }
  return res;
}

  if (m.live && S.aliases) { let js = JSON.stringify(m); Object.entries(S.aliases).forEach(([a, b]) => { js = js.split('"' + a + '"').join('"' + b + '"'); }); m = G.m = JSON.parse(js); }
  if (!S.matches.some(x => x.id === m.id)) S.matches.push(m); S.active = null;
  if (!m.live || m.hostUid === (AUTH.user && AUTH.user.id)) queueMatch(m);
  if (m.live) { livePush(); LIVE.id = null; }
  let careerMsg = '';
  if (m.career) {
    const L = m.career, won = !m.sides[m.winner].bot;
    S.career.results[L] = S.career.results[L] || { w: 0, l: 0 };
    S.career.results[L][won ? 'w' : 'l']++;
    if (won && L > S.career.best) { S.career.best = L; careerMsg = L === 30 ? '👑 Du bist der CHAMPION von Dartsportz!' : `🔓 Level ${L + 1} freigeschaltet: ${botDef(L + 1).name}`; }
    G.timers.push(setTimeout(() => botSays(L, won ? 'youMatch' : 'meMatch'), 600));
  }
  save(true);
  const w = m.sides[m.winner];
  const rows = m.sides.flatMap((sd, si) => sd.members.map(pid => { const p = playerById(pid); let d = 0, pt = 0, f = 0, hi = 0, o180 = 0; m.legs.forEach(l => { let k = 0; l.visits.forEach(v => { if (v.pid === pid) { d += v.darts.length; pt += v.bust ? 0 : v.scored; if (v.scored === 180) o180++; if (v.checkout && v.before > hi) hi = v.before; } }); }); return `<tr><td>${esc(pName(p))}</td><td><b>${fmt(d ? pt / d * 3 : 0)}</b></td><td>${o180}</td><td>${hi || '–'}</td><td>${d}</td></tr>`; })).join('');
  setTimeout(() => modal(`<div style="text-align:center;font-size:56px">🏆</div><h2 class="bb">${esc(w.name)} gewinnt!</h2>
    <p class="mut" style="text-align:center;margin-top:-6px">${m.sides.map((s, i) => esc(s.name) + ' ' + (m.settings.unit === 'sets' ? m.setsWon[i] : m.legsWon[i])).join(' : ')}</p>
    ${careerMsg ? `<div class="story" style="text-align:center;font-weight:700">${careerMsg}</div>` : ''}
    <table style="width:100%;border-collapse:collapse;font-size:14px;margin-bottom:14px"><tr class="mut" style="text-align:left"><th>Spieler</th><th>Ø</th><th>180</th><th>Finish</th><th>Darts</th></tr>${rows}</table>
    <div class="grid2"><button class="btn sec" id="mdone">Fertig</button><button class="btn" id="mre">${m.career && !m.sides[m.winner].bot && m.career < 30 ? 'Nächster Gegner' : 'Revanche'}</button></div>`, (md, close) => {
    $('#mdone', md).onclick = () => { close(); G = null; go(m.career ? 'career' : 'home'); };
    $('#mre', md).onclick = () => {
      close(); G = null;
      if (m.career && !m.sides[m.winner].bot && m.career < 30) return startCareer(m.career + 1);
      const sides = m.sides.map(s => ({ ...s, members: [...s.members] }));
      const bc = chooseBoard(sides, m.boardId);
      const mm = createMatch({ sides, settings: m.settings, boardId: bc.id, starter: (m.startSide + 1) % sides.length, career: m.career });
      S.active = mm; save(true); go('game', { fresh: true, why: bc.why });
    };
  }), 900);
}
function liveStats() {
  const m = G.m;
  const rows = m.sides.map((sd, i) => { let d = 0, p = 0, f9d = 0, f9p = 0, s180 = 0, s100 = 0, att = 0, hit = 0; m.legs.forEach(l => { let k = 0; l.visits.forEach(v => { if (v.side !== i) return; d += v.darts.length; const sc = v.bust ? 0 : v.scored; p += sc; if (k < 3) { f9d += v.darts.length; f9p += sc; } k++; if (sc === 180) s180++; else if (sc >= 100) s100++; v.darts.forEach((x, j) => { if (x.att) { att++; if (v.checkout && j === v.darts.length - 1) hit++; } }); }); }); return `<tr><td><b>${esc(sd.name)}</b></td><td>${fmt(d ? p / d * 3 : 0)}</td><td>${fmt(f9d ? f9p / f9d * 3 : 0)}</td><td>${s180}</td><td>${s100}</td><td>${att ? Math.round(hit / att * 100) : 0}% (${hit}/${att})</td></tr>`; }).join('');
  modal(`<h2 class="bb">Live-Statistik</h2><table style="width:100%;font-size:13.5px;border-collapse:collapse"><tr class="mut" style="text-align:left"><th></th><th>Ø</th><th>F9</th><th>180</th><th>100+</th><th>Checkout</th></tr>${rows}</table><p class="mut xs">Scheibe: ${esc(boardById(m.boardId).name)}</p>`);
}

/* ================= CRICKET & PARTYSPIELE ================= */
const CR_T = [20, 19, 18, 17, 16, 15, 25];
const PARTY = {
  cricket: {
    name: 'Cricket', em: '❌', color: 't-or2', desc: 'Schließe 15–20 und Bull, sammle Punkte und spiel den Gegner aus.',
    cfg: { mode: 'standard', rounds: 20 },
    settings: c => `<div class="lbl">Variante</div>${pseg('mode', [['standard', 'Standard'], ['cut', 'Cut-Throat']], c)}<div class="xs mut">Cut-Throat: Deine Punkte bekommen die Gegner – wenig Punkte gewinnen.</div>${pstep('Max. Runden', 'rounds', c)}`,
    init(P) { P.d = { marks: P.players.map(() => Object.fromEntries(CR_T.map(t => [t, 0]))), pts: P.players.map(() => 0) }; },
    dart(P, n, m) {
      if (!CR_T.includes(n)) return;
      const d = P.d, me = P.cur, mk = d.marks[me], had = mk[n];
      const close = Math.max(0, Math.min(m, 3 - had)), extra = m - close; mk[n] += m;
      if (extra > 0) {
        const val = (n === 25 ? 25 : n) * extra;
        const open = P.players.map((_, i) => i).filter(i => i !== me && d.marks[i][n] < 3);
        if (P.cfg.mode === 'cut') open.forEach(i => d.pts[i] += val);
        else if (open.length) d.pts[me] += val;
      }
      if (had < 3 && mk[n] >= 3) return { msg: (n === 25 ? 'Bull' : n) + ' zu!' };
    },
    over(P) {
      const d = P.d, cut = P.cfg.mode === 'cut';
      const best = (arr) => cut ? Math.min(...arr) : Math.max(...arr);
      for (let i = 0; i < P.players.length; i++) { const all = CR_T.every(t => d.marks[i][t] >= 3); if (all && d.pts[i] === best(d.pts)) return i; }
      if (P.round > P.cfg.rounds) { const b = best(d.pts); return d.pts.indexOf(b); }
      return null;
    },
    panel(P) {
      const d = P.d, sym = k => k <= 0 ? '' : k === 1 ? '/' : k === 2 ? '✕' : '⊗';
      return `<div class="card" style="padding:8px;margin:0 10px"><table class="ptable"><tr><th></th>${P.players.map((pid, i) => `<th style="color:${i === P.cur ? 'var(--or)' : 'inherit'}">${esc(pName(playerById(pid)).slice(0, 8))}</th>`).join('')}</tr>
        ${CR_T.map(t => `<tr class="${P.players.every((_, i) => d.marks[i][t] >= 3) ? 'cl' : ''}"><td class="num">${t === 25 ? 'B' : t}</td>${P.players.map((_, i) => `<td class="mk" style="color:${d.marks[i][t] >= 3 ? 'var(--ok)' : '#fff'}">${sym(d.marks[i][t])}</td>`).join('')}</tr>`).join('')}
        <tr><td class="mut xs">Pkt</td>${d.pts.map((p, i) => `<td class="bb" style="font-size:24px;color:${i === P.cur ? 'var(--or)' : '#fff'}">${p}</td>`).join('')}</tr></table></div>`;
    },
  },
  killer: {
    name: 'Killer', em: '💀', color: 't-or', desc: 'Werde zum Killer, nimm deine Rivalen ins Visier – der Letzte gewinnt.',
    cfg: { lives: 3, seg: true, chaos: false, assign: 'random' }, min: 2,
    settings: c => `<div class="lbl">Leben</div>${pseg('lives', [[3, '3'], [5, '5'], [10, '10']], c)}
      <div class="row" style="margin:12px 0"><b class="sp">Steigerung nach Segmenten</b><button class="switch ${c.seg ? 'on' : ''}" data-psw="seg"></button></div><div class="xs mut">Single = 1, Double = 2, Triple = 3. Aus: jeder Treffer zählt 1.</div>
      <div class="row" style="margin:12px 0"><b class="sp">Chaos</b><button class="switch ${c.chaos ? 'on' : ''}" data-psw="chaos"></button></div><div class="xs mut">Triffst du eine fremde Zahl, bevor du Killer bist, schenkst du dem Gegner Leben.</div>
      <div class="lbl">Zahlen-Vergabe</div>${pseg('assign', [['random', 'Zufällig'], ['manual', 'Selbst wählen']], c)}`,
    init(P) {
      const n = P.players.length;
      let nums = P.cfg.nums;
      if (!nums) { const pool = Array.from({ length: 20 }, (_, i) => i + 1).sort(() => Math.random() - .5); nums = pool.slice(0, n); }
      P.d = { nums, lives: Array(n).fill(0), killer: Array(n).fill(false), out: Array(n).fill(false) };
    },
    dart(P, n, m) {
      const d = P.d, L = P.cfg.lives, me = P.cur; if (!n || n === 25) return;
      const val = P.cfg.seg ? m : 1; const owner = d.nums.findIndex((x, i) => x === n && !d.out[i]);
      if (owner < 0) return;
      const nm = i => pName(playerById(P.players[i]));
      if (owner === me) {
        if (!d.killer[me]) { d.lives[me] = Math.min(L, d.lives[me] + val); if (d.lives[me] >= L) { d.killer[me] = true; return { msg: '💀 ' + nm(me) + ' ist KILLER!' }; } }
        else { d.lives[me] -= val; if (d.lives[me] <= 0) { d.out[me] = true; return { msg: nm(me) + ' hat sich selbst erledigt!', end: true }; } }
      } else if (d.killer[me]) {
        d.lives[owner] -= val; if (d.lives[owner] <= 0) { d.lives[owner] = 0; d.out[owner] = true; return { msg: '☠️ ' + nm(owner) + ' ist raus!' }; }
        return { msg: nm(owner) + ' verliert ' + val + (val > 1 ? ' Leben' : ' Leben') };
      } else if (P.cfg.chaos) d.lives[owner] = Math.min(L, d.lives[owner] + val);
    },
    alive(P, i) { return !P.d.out[i]; },
    over(P) { const al = P.d.out.map((o, i) => o ? -1 : i).filter(i => i >= 0); return al.length === 1 ? al[0] : al.length === 0 ? P.cur : null; },
    panel(P) {
      const d = P.d, L = P.cfg.lives;
      return `<div class="sides">${P.players.map((pid, i) => `<div class="pside ${i === P.cur ? 'act' : ''} ${d.out[i] ? 'out' : ''}"><div class="nm">${esc(pName(playerById(pid)))}</div><div class="big">${d.nums[i]}</div><div class="lives">${'❤️'.repeat(Math.max(0, d.lives[i]))}${'🖤'.repeat(Math.max(0, L - d.lives[i]))}</div><div class="sub">${d.out[i] ? 'RAUS' : d.killer[i] ? '💀 KILLER' : 'sammelt Leben'}</div></div>`).join('')}</div>`;
    },
    hint(P) { const d = P.d, me = P.cur; return d.killer[me] ? 'Ziel: Zahlen der Gegner' : 'Triff deine ' + d.nums[me] + ' um Killer zu werden'; },
  },
  highscore: {
    name: 'Highscore', em: '🔥', color: 't-dk', desc: 'Wer holt in X Runden die meisten Punkte?',
    cfg: { rounds: 7 },
    settings: c => pstep('Runden', 'rounds', c),
    init(P) { P.d = { pts: P.players.map(() => 0) }; },
    dart(P, n, m) { P.d.pts[P.cur] += n * m; },
    over(P) { if (P.round > P.cfg.rounds) return P.d.pts.indexOf(Math.max(...P.d.pts)); return null; },
    panel(P) { return `<div class="sides">${P.players.map((pid, i) => `<div class="pside ${i === P.cur ? 'act' : ''}"><div class="nm">${esc(pName(playerById(pid)))}</div><div class="big">${P.d.pts[i]}</div><div class="sub">Ø ${fmt(P.d.pts[i] / Math.max(1, P.round - (i < P.cur ? 0 : 1)), 1)}</div></div>`).join('')}</div>`; },
    hint(P) { return `Runde ${Math.min(P.round, P.cfg.rounds)} / ${P.cfg.rounds}`; },
  },
  shanghai: {
    name: 'Shanghai', em: '🀄', color: 't-gr', desc: 'Runde 1 zählt nur die 1, Runde 2 nur die 2 … Shanghai = sofortiger Sieg!',
    cfg: { rounds: 7 },
    settings: c => `${pseg('rounds', [[7, '1–7'], [10, '1–10'], [20, '1–20']], c)}<div class="xs mut">Shanghai: Single, Double und Triple der Rundenzahl in einer Aufnahme.</div>`,
    init(P) { P.d = { pts: P.players.map(() => 0), sh: [] }; },
    dart(P, n, m) {
      if (P.darts.length === 0) P.d.sh = [];
      if (n === P.round) { P.d.pts[P.cur] += n * m; P.d.sh.push(m); if ([1, 2, 3].every(k => P.d.sh.includes(k))) { P.d.win = P.cur; return { msg: '🀄 SHANGHAI!', end: true }; } }
    },
    over(P) { if (P.d.win != null) return P.d.win; if (P.round > P.cfg.rounds) return P.d.pts.indexOf(Math.max(...P.d.pts)); return null; },
    panel(P) { return `<div class="sides">${P.players.map((pid, i) => `<div class="pside ${i === P.cur ? 'act' : ''}"><div class="nm">${esc(pName(playerById(pid)))}</div><div class="big">${P.d.pts[i]}</div></div>`).join('')}</div>`; },
    hint(P) { return `Runde ${Math.min(P.round, P.cfg.rounds)}: Ziel ist die ${Math.min(P.round, P.cfg.rounds)}`; },
  },
};

function prender() {

/* ---------- Push-Benachrichtigungen ---------- */
function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function isStandalone() { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function enablePush() {
  if (!online()) return toast('Bitte zuerst einloggen');
  if (/iPhone|iPad/.test(navigator.userAgent) && !isStandalone()) return modal(`<h2 class="bb">Erst installieren</h2><p>Auf dem iPhone funktionieren Push-Nachrichten nur, wenn Dartsportz auf dem Home-Bildschirm liegt:</p><ol class="sm" style="line-height:1.6"><li>In Safari unten auf <b>Teilen</b> (□↑)</li><li><b>„Zum Home-Bildschirm“</b></li><li>App über das neue Symbol öffnen und hier nochmal tippen</li></ol><button class="btn" onclick="this.closest('.modal-bg').remove()">OK</button>`);
  if (!pushSupported()) return toast('Dieses Gerät unterstützt keine Push-Nachrichten', 3000);
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return toast('Benachrichtigungen wurden nicht erlaubt. Ändern in den iPhone-Einstellungen → Dartsportz.', 4000);
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID_PUB) });
  const js = sub.toJSON();
  await sb.from('push_subscriptions').delete().eq('user_id', AUTH.user.id).eq('subscription->>endpoint', js.endpoint);
  const { error } = await sb.from('push_subscriptions').insert({ user_id: AUTH.user.id, subscription: js });
  if (error) return toast('Fehler: ' + error.message, 3500);
  S.settings.push = true; save(); toast('🔔 Push-Benachrichtigungen aktiv'); render();
}
async function sendPush(to, title, body, url, tag) {
  if (!online()) return;
  try { const { data } = await sb.auth.getSession(); const tk = data.session && data.session.access_token; if (!tk) return;
    fetch('/api/push', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tk }, body: JSON.stringify({ to, title, body, url, tag }) }).catch(() => {});
  } catch (e) {}
}

function drillTitle(t) { const d = DRILLS.find(x => x.id === t.drill); return d.name + (t.label ? ' · ' + t.label : ''); }
function drillConfig(id) {
  const c = { n: 30, target: id === 'treble' ? 'T20' : id === 'double' ? 'D20' : 'BULL', all: false, per: 3, ring: 'S', bullMode: '50', rounds: 10 };
  const body = () => {
    if (id === 'bull') return `<div class="seg"><button data-k="bullMode" data-v="50" class="${c.bullMode === '50' ? 'on' : ''}">Nur Bull (50)</button><button data-k="bullMode" data-v="25" class="${c.bullMode === '25' ? 'on' : ''}">Bull + 25</button></div>${stepRow('Anzahl Würfe', 'n', c.n)}`;

    if (id === 'treble') return `<select id="tg">${Array.from({ length: 20 }, (_, i) => 'T' + (20 - i)).map(x => `<option ${x === c.target ? 'selected' : ''}>${x}</option>`).join('')}</select>${stepRow('Anzahl Würfe', 'n', c.n)}`;
    if (id === 'atc') return `<div class="seg"><button data-k="ring" data-v="S" class="${c.ring === 'S' ? 'on' : ''}">Singles</button><button data-k="ring" data-v="D" class="${c.ring === 'D' ? 'on' : ''}">Doppel</button><button data-k="ring" data-v="T" class="${c.ring === 'T' ? 'on' : ''}">Triples</button></div>`;
    if (id === 'finish') return stepRow('Anzahl Runden', 'rounds', c.rounds);
    return '<p class="mut">Start mit 27 Punkten. D1 bis D20, dann Bull. Pro Doppel 3 Darts – du gibst die Anzahl der Treffer ein.</p>';
  };
  const stepRow = (l, k, v) => `<div class="row" style="margin:12px 0"><span class="sp">${l}</span><div class="stepper"><button data-st="${k}" data-d="-1">−</button><b class="bb">${v}</b><button data-st="${k}" data-d="1">＋</button></div></div>`;

    on(m, '[data-st]', 'click', b => { const k = b.dataset.st, step = k === 'n' ? 5 : 1; c[k] = clamp(c[k] + step * +b.dataset.d, 1, k === 'n' ? 300 : 30); draw(); });

function buildDrill(id, c) {
  const run = { id, c, i: 0, log: [], hits: 0, attempts: 0, done: false };

  if (id === 'double') { if (c.all) { run.seq = DBL_LIST.flatMap(x => Array(c.per).fill(x)); run.label = 'Alle Doppel'; } else { run.seq = Array(c.n).fill(c.target); run.label = c.target; } }
  if (id === 'treble') { run.seq = Array(c.n).fill(c.target); run.label = c.target; }
  if (id === 'atc') { run.seq = [...Array.from({ length: 20 }, (_, i) => (c.ring === 'S' ? '' : c.ring) + (i + 1)), 'BULL']; run.advance = true; run.label = { S: 'Singles', D: 'Doppel', T: 'Triples' }[c.ring]; }
  if (id === 'bobs') { run.seq = DBL_LIST; run.score = 27; run.label = ''; }
  if (id === 'finish') { run.seq = Array.from({ length: c.rounds }, () => { let r; do { r = 41 + Math.floor(Math.random() * 80); } while (!checkout(r, 3)); return String(r); }); run.label = c.rounds + ' Runden'; }
  return run;
}
V.drill = (p) => {
  if (!p.run) p.run = buildDrill(p.id, p.c);
  const run = p.run, d = DRILLS.find(x => x.id === run.id);
  const draw = r => {
    const t = run.seq[Math.min(run.i, run.seq.length - 1)];
    const pct = run.attempts ? Math.round(run.hits / run.attempts * 100) : 0;
    let mid = '', btns = '';
    if (run.done) {
      mid = `<div style="text-align:center;font-size:60px">🏁</div><div class="drill-big" style="font-size:72px">${run.id === 'bobs' ? run.score : run.id === 'atc' ? run.attempts : pct + '%'}</div><p class="mut" style="text-align:center">${run.id === 'bobs' ? (run.score < 0 ? 'Unter 0 gefallen – Spiel vorbei.' : 'Punkte') : run.id === 'atc' ? 'Darts benötigt' : `${run.hits} von ${run.attempts} getroffen`}</p>`;
      btns = `<div class="grid2"><button class="btn sec" id="dback">Fertig</button><button class="btn" id="dagain">Nochmal</button></div>`;
    } else if (run.id === 'bobs') {
      mid = `<div class="mut" style="text-align:center">Punkte: <b style="color:var(--txt);font-size:22px">${run.score}</b></div><div class="drill-big">${t}</div><p class="mut" style="text-align:center">Wie viele Treffer mit 3 Darts?</p>`;
      btns = `<div class="grid2" style="grid-template-columns:repeat(4,1fr)">${[0, 1, 2, 3].map(k => `<button class="btn ${k ? '' : 'sec'}" style="height:84px;font-size:30px" data-hits="${k}">${k}</button>`).join('')}</div>`;
    } else if (run.id === 'finish') {
      const co = checkout(+t, 3);
      mid = `<div class="mut" style="text-align:center">Runde ${run.i + 1}/${run.seq.length} · ${run.hits} gecheckt</div><div class="drill-big">${t}</div><p style="text-align:center;font-weight:800;color:var(--or2)">${co ? co.map(dLabel).join(' · ') : ''}</p><p class="mut sm" style="text-align:center">9 Darts Zeit</p>`;
      btns = `<div class="hitbtns"><button class="nohit" data-h="0">Nicht gecheckt</button><button class="hit" data-h="1">Gecheckt ✓</button></div>`;
    } else {
      mid = `<div class="mut" style="text-align:center">${run.advance ? `Darts: ${run.attempts}` : `Wurf ${run.attempts + 1}/${run.seq.length} · ${pct}%`}</div><div class="drill-big">${t}</div>`;
      btns = `<div class="hitbtns"><button class="nohit" data-h="0">Daneben ✗</button><button class="hit" data-h="1">Getroffen ✓</button></div>`;
    }
    const hl = run.id === 'bull' ? 'bull' : run.id === 'treble' ? 'treble' : (run.id === 'double' || run.id === 'bobs') ? 'double' : null;
    $('#dv', r).innerHTML = `<div class="bar" style="margin-bottom:10px"><i style="width:${(run.done ? 1 : run.i / run.seq.length) * 100}%"></i></div>${!run.done ? `<div style="width:150px;height:150px;margin:0 auto">${boardSVG(boardById(me().board), { highlight: hl, numbers: false })}</div>` : ''}${mid}${btns}${!run.done && run.log.length ? '<button class="btn ghost" style="margin-top:12px" id="dundo">↶ Rückgängig</button>' : ''}`;
  };
  const finish = () => { run.done = true; S.training.push({ id: uid(), drill: run.id, label: run.label, date: Date.now(), hits: run.hits, attempts: run.attempts, score: run.score, log: run.log, pid: S.me }); save(true); chime(true); };
  return {
    title: d.name.toUpperCase(), tab: 'train', left: backBtn('train'), right: `<button class="ic" onclick="showRules('${run.id}')">?</button>`, html: '<div id="dv"></div>',
    mount(r) {
      draw(r);
      on(r, '[data-h]', 'click', b => {
        const hit = b.dataset.h === '1'; vibrate(hit ? 25 : 8); impact(me().board, !hit);
        run.log.push({ t: run.seq[run.i], hit }); run.attempts++; if (hit) run.hits++;
        if (!run.advance || hit) run.i++;
        if (run.i >= run.seq.length) finish();
        draw(r);
      });
      on(r, '[data-hits]', 'click', b => {
        const k = +b.dataset.hits, t = run.seq[run.i], v = t === 'BULL' ? 50 : 2 * +t.slice(1);
        run.log.push({ t, hits: k }); run.attempts += 3; run.hits += k; run.score += k ? k * v : -v; run.i++;
        impact(me().board, !k);
        if (run.score < 0 || run.i >= run.seq.length) finish();
        draw(r);
      });
      on(r, '#dundo', 'click', () => {
        const l = run.log.pop(); if (!l) return;
        if (run.id === 'bobs') { const v = l.t === 'BULL' ? 50 : 2 * +l.t.slice(1); run.score -= l.hits ? l.hits * v : -v; run.attempts -= 3; run.hits -= l.hits; run.i--; }
        else { run.attempts--; if (l.hit) run.hits--; if (!run.advance || l.hit) run.i--; }
        draw(r);
      });
      on(r, '#dback', 'click', () => go('train'));
      on(r, '#dagain', 'click', () => go('drill', { id: run.id, c: run.c }));
    }
  };
};

let statUI = { pid: null, tab: 'x01', per: 'year', off: 0 };
function periodFilter() {
  const now = new Date(); const { per, off } = statUI;
  if (per === 'all') return { f: () => true, label: 'Allzeit' };
  if (per === 'year') { const y = now.getFullYear() + off; return { f: m => new Date(m.created || m.date).getFullYear() === y, label: String(y) }; }
  const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
  return { f: m => { const x = new Date(m.created || m.date); return x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth(); }, label: d.toLocaleString('de-DE', { month: 'long', year: 'numeric' }) };
}

      <div class="lbl">System</div>${seg('system', [['classic', 'Schaft + Flight'], ['onepiece', 'Flight-Schaft-System (1 Teil)']])}
      <div class="lbl">Spitze</div><div class="card">${rng('tipLen', 'Länge', 26, 41, 'mm')}${col('tipColor', 'Farbe')}</div>
      <div class="lbl">Barrel</div><div class="card">${seg('barrelShape', [['straight', 'Gerade'], ['torpedo', 'Torpedo'], ['scalloped', 'Scalloped'], ['bomb', 'Bomb']])}${rng('barrelLen', 'Länge', 38, 56, 'mm')}${rng('barrelWeight', 'Gewicht', 16, 30, 'g')}${seg('grip', [['ring', 'Ringe'], ['shark', 'Shark'], ['knurl', 'Rändel'], ['smooth', 'Glatt']])}${col('barrelColor', 'Grundfarbe')}${col('barrelColor2', 'Grip-Farbe')}</div>
      ${d.system === 'classic' ? `<div class="lbl">Schaft</div><div class="card">${seg('shaftLen', [['short', 'Short'], ['inbetween', 'Inbetw.'], ['medium', 'Medium'], ['long', 'Long']])}<div class="xs mut">${SHAFT_LBL[d.shaftLen]}</div>${col('shaftColor', 'Farbe')}</div>` : ''}
      <div class="lbl">Flight${d.system === 'onepiece' ? ' (inkl. Schaft)' : ''}</div><div class="card">${seg('flightShape', [['standard', 'Standard'], ['slim', 'Slim'], ['kite', 'Kite'], ['pear', 'Pear'], ['teardrop', 'Teardrop']])}
        <div class="field"><label>Flight-Nummer / Bezeichnung</label><input type="text" id="fno" value="${esc(d.flightNo)}" placeholder="z. B. No. 2, No. 6"></div>${col('flightColor', 'Hauptfarbe')}${col('flightColor2', 'Streifen')}
        <div class="row" style="margin-top:8px"><span class="sp sm">Logo auf dem Flight</span><button class="btn sm sec" id="flogo">${d.flightLogo ? 'Ändern' : 'Hochladen'}</button>${d.flightLogo ? '<button class="btn sm sec" id="flogox">✕</button>' : ''}</div></div>
      <div class="lbl">Fotos deiner echten Pfeile</div><div class="card"><div class="photos">${(d.photos || []).map((ph, i) => `<img src="${ph}" data-ph="${i}">`).join('')}</div><button class="btn sec" id="padd" style="margin-top:10px">📷 Foto hinzufügen</button><div class="xs mut" style="margin-top:6px">Max. 4 Fotos · Tippen zum Löschen</div></div>`,
    mount(r) {
      const upd = () => { save(); if (pl.id === S.me) pushProfile(); $('#dp', r).innerHTML = dartSVG(d, 'dz' + Math.random().toString(36).slice(2, 5)); };
      on(r, '[data-k]', 'click', b => { d[b.dataset.k] = b.dataset.v; save(); if (pl.id === S.me) pushProfile(); render(); });
      r.addEventListener('input', e => {
        const t = e.target;
        if (t.dataset.r) { d[t.dataset.r] = +t.value; $('#l_' + t.dataset.r, r).textContent = t.value; upd(); }
        if (t.dataset.c) { d[t.dataset.c] = t.value; upd(); }
        if (t.id === 'dn') { d.name = t.value; save(); }
        if (t.id === 'fno') { d.flightNo = t.value; save(); }
      });
      $('#flogo', r).onclick = async () => { const f = await pickFile(); if (!f) return; d.flightLogo = await resizeImage(f, 160, .85); save(); render(); };
      $('#flogox', r) && ($('#flogox', r).onclick = () => { d.flightLogo = null; save(); render(); });
      $('#padd', r).onclick = async () => { if ((d.photos || []).length >= 4) return toast('Maximal 4 Fotos'); const f = await pickFile(); if (!f) return; d.photos = d.photos || []; d.photos.push(await resizeImage(f, 700, .7)); save(); render(); };
      on(r, '[data-ph]', 'click', async b => { if (await confirmBox('Foto löschen?', 'Löschen')) { d.photos.splice(+b.dataset.ph, 1); save(); render(); } });
    }
  };
};

/* ================= EINSTELLUNGEN ================= */
function settingsBlock() {
  const s = S.settings;
  const seg = (k, opts) => `<div class="seg">${opts.map(([v, l]) => `<button data-s="${k}" data-v="${v}" class="${s[k] == v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const sw = (k, l) => `<div class="row" style="margin:12px 0"><span class="sp">${l}</span><button class="switch ${s[k] ? 'on' : ''}" data-sw="${k}"></button></div>`;
  return `<div class="lbl">Wurfanimation</div>${seg('anim', [['off', 'Aus'], ['fast', 'Schnell'], ['normal', 'Normal'], ['slow', 'Langsam']])}
    ${sw('sound', 'Aufprall-Sound')}<div class="field"><label>Lautstärke</label><input type="range" min="0" max="1" step=".05" value="${s.volume}" data-vol></div>
    ${sw('zoom', 'Großansicht beim Wurf (Hintergrund unscharf)')}
    <div class="lbl">Ansager</div>${seg('caller', [['off', 'Aus'], ['de', 'Deutsch'], ['en', 'Englisch']])}
    ${s.caller !== 'off' ? `<div class="field"><label>Stimme</label><select data-voice="${s.caller}">${voicesFor(s.caller).sort((a, b) => voiceScore(b) - voiceScore(a)).map(v => `<option value="${esc(v.voiceURI)}" ${bestVoice(s.caller) === v ? 'selected' : ''}>${esc(v.name)}${voiceScore(v) >= 30 ? ' ⭐' : ''}</option>`).join('') || '<option>Systemstimme</option>'}</select></div>` : ''}
    <button class="btn sm sec" data-test>🔊 Test</button> <button class="btn sm sec" data-vhelp>Natürlichere Stimme?</button>
    ${sw('botVoice', 'Bots sprechen (Sprachausgabe)')}${sw('vibrate', 'Vibration')}`;
}
function bindSettings(m) {
  on(m, '[data-s]', 'click', b => { S.settings[b.dataset.s] = b.dataset.v; save(); $$(`[data-s="${b.dataset.s}"]`, m).forEach(x => x.classList.toggle('on', x === b)); });
  on(m, '[data-sw]', 'click', b => { const k = b.dataset.sw; S.settings[k] = !S.settings[k]; b.classList.toggle('on', S.settings[k]); save(); });
  m.addEventListener('change', e => { const l = e.target.dataset.voice; if (l) { S.settings[l === 'en' ? 'voiceEn' : 'voiceDe'] = e.target.value; save(); say(CALL.score(180), null, { flush: true }); } });
  on(m, '[data-vhelp]', 'click', () => modal(`<h2 class="bb">Natürlichere Stimme</h2><p class="sm">Die App nutzt die Stimmen deines iPhones. Die Standardstimme klingt blechern – die besseren musst du einmal kostenlos laden:</p><ol class="sm" style="line-height:1.6"><li>Einstellungen → <b>Bedienungshilfen</b></li><li><b>Gesprochene Inhalte</b> → <b>Stimmen</b> → <b>Deutsch</b></li><li>z. B. <b>Anna (Premium)</b>, <b>Helena (Erweitert)</b> oder <b>Markus (Erweitert)</b> laden</li><li>App neu öffnen und hier unter „Stimme“ auswählen (⭐ = hohe Qualität)</li></ol><p class="sm mut">Für Englisch genauso, z. B. „Daniel (Premium)“ – klingt wie ein echter Caller.</p><button class="btn" onclick="this.closest('.modal-bg').remove()">Alles klar</button>`));
  on(m, '[data-s="caller"]', 'click', () => { const bg = m.closest('.modal-bg'); if (!bg) setTimeout(render, 10); });
  on(m, '[data-test]', 'click', () => { impact(me().board); setTimeout(() => say(CALL.score(180), null, { flush: true }), 200); });
  m.addEventListener('input', e => { if (e.target.dataset.vol != null) { S.settings.volume = +e.target.value; save(); } });
}
V.settings = () => {
  const p = me();
  return {
    title: 'EINSTELLUNGEN', tab: 'user', left: backBtn('user'), right: spacer,
    html: `<div class="card">${settingsBlock()}</div>
    ${p.admin ? `<div class="lbl">Admin · Scheiben-Sounds</div><div class="card list">${BOARDS.map(b => { const cur = S.settings.boardSounds[b.id] || b.sound; const custom = cur.startsWith('data:'); return `<div class="it"><div style="width:34px;height:34px;flex:none">${boardSVG(b, { numbers: false })}</div><div class="sp"><b class="sm">${esc(b.name)}</b><select data-bs="${b.id}" style="padding:6px;margin-top:4px;font-size:14px">${Object.entries(SOUND_PRESETS).map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v.label}</option>`).join('')}${custom ? '<option selected value="__c">Eigene Aufnahme</option>' : ''}</select></div><button class="btn sm sec" data-up="${b.id}">⤒</button><button class="btn sm sec" data-play="${b.id}">▶</button></div>`; }).join('')}<div class="xs mut" style="margin-top:8px">Mit ⤒ lädst du eine eigene Aufnahme hoch (kurze Audiodatei). Die Synchronisation an alle Nutzer folgt mit Supabase.</div></div>` : ''}
    <div class="lbl">Daten</div><div class="card"><div class="grid2"><button class="btn sec" id="bex">Backup kopieren</button><button class="btn sec" id="bim">Backup einfügen</button></div><button class="btn ghost" id="breset" style="color:#f87171">Alle Daten löschen</button></div>
    <div class="lbl">Push-Benachrichtigungen</div><div class="card"><div class="row"><div class="sp"><b>Chat & Spieleinladungen</b><div class="mut xs">${typeof Notification !== 'undefined' && Notification.permission === 'granted' && S.settings.push ? 'Aktiv auf diesem Gerät' : 'Benachrichtigt dich auch, wenn die App zu ist'}</div></div><button class="btn sm ${S.settings.push ? 'sec' : ''}" id="pon">${S.settings.push ? 'Neu verbinden' : 'Aktivieren'}</button></div></div>
    <div class="lbl">Online & Login</div><button class="card row" style="width:100%" onclick="go('account')"><span style="font-size:24px">🌍</span><div class="sp" style="text-align:left"><b>${AUTH.user ? 'Eingeloggt' : 'Login / Registrieren'}</b><div class="mut sm">${AUTH.user ? esc(AUTH.user.email) : 'Freunde, Live-Spiele, Chat'}</div></div><span class="mut">›</span></button>
    <p class="xs dim" style="text-align:center">Dartsportz v0.3 · offline-fähig</p>`,
    mount(r) {
      bindSettings(r);
      $('#pon', r).onclick = enablePush;
      on(r, '[data-bs]', 'change', () => {});
      r.addEventListener('change', e => { const b = e.target.dataset.bs; if (b && e.target.value !== '__c') { S.settings.boardSounds[b] = e.target.value; save(); impact(b); pushBoardSounds(); } });
      on(r, '[data-play]', 'click', b => impact(b.dataset.play));
      on(r, '[data-up]', 'click', async b => { const f = await pickFile('audio/*'); if (!f) return; if (f.size > 400000) return toast('Datei zu groß (max. 400 KB)'); const rd = new FileReader(); rd.onload = () => { S.settings.boardSounds[b.dataset.up] = rd.result; save(); impact(b.dataset.up); pushBoardSounds(); render(); }; rd.readAsDataURL(f); });
      $('#bex', r).onclick = async () => { const txt = JSON.stringify(S); try { await navigator.clipboard.writeText(txt); toast('Backup kopiert (' + Math.round(txt.length / 1024) + ' KB)'); } catch (e) { modal(`<h2 class="bb">Backup</h2><textarea rows="8">${esc(txt)}</textarea>`); } };
      $('#bim', r).onclick = () => modal(`<h2 class="bb">Backup einfügen</h2><textarea id="bt" rows="8" placeholder="Backup-Text hier einfügen"></textarea><div style="height:10px"></div><button class="btn" id="bok">Wiederherstellen</button>`, (m, close) => { $('#bok', m).onclick = () => { try { const d = JSON.parse($('#bt', m).value); if (!d.players) throw 0; Object.keys(S).forEach(k => delete S[k]); Object.assign(S, loadStoreFrom(d)); save(true); close(); toast('Wiederhergestellt'); go('home'); } catch (e) { toast('Ungültiges Backup'); } }; });
      $('#breset', r).onclick = async () => { if (await confirmBox('Wirklich ALLE Daten löschen?', 'Löschen')) { try { localStorage.removeItem(LS_KEY); } catch (e) {} Object.keys(S).forEach(k => delete S[k]); Object.assign(S, loadStoreFrom({})); G = null; go('welcome'); } };
    }
  };
};
function loadStoreFrom(d) { const x = Object.assign({}, d); x.players = x.players || []; x.teams = x.teams || []; x.matches = x.matches || []; x.training = x.training || []; x.career = x.career || { best: 0, results: {} }; x.settings = Object.assign({}, DEFAULT_SETTINGS, x.settings || {}); x.me = x.me || null; return x; }

/* ================= START ================= */
document.addEventListener('click', () => ac(), { once: true });
cloudInit();
try { const cq = new URLSearchParams(location.search).get('chat'); if (cq && me()) route = { name: 'chatroom', p: { fid: cq } }; } catch (e) {}
try { if (!me() && new URLSearchParams(location.search).get('invite')) route = { name: 'account', p: { mode: 'reg' } }; } catch (e) {}
render();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claudeusercontent|claude\.ai/.test(location.host)) navigator.serviceWorker.register('sw.js').catch(() => {});
</script></body></html>
