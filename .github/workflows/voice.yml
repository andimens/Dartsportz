name: Caller-Stimme erzeugen (ElevenLabs)
on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'Sprache (de oder en)'
        required: true
        default: 'de'
      voice_id:
        description: 'ElevenLabs Voice ID'
        required: true
      voice_name:
        description: 'Name der Stimme (nur zur Anzeige)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Ansagen erzeugen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_NAME: ${{ inputs.voice_name }}
        run: node tools/gen-voice.mjs "${{ inputs.lang }}" "${{ inputs.voice_id }}"
      - name: Speichern
        if: always()
        run: |
          git config user.name "dartsportz-bot"; git config user.email "bot@users.noreply.github.com"
          git add audio && git commit -m "Caller-Stimme ${{ inputs.lang }} aktualisiert" && git push || echo "nichts Neues"
