name: Supabase wach halten
on:
  schedule:
    - cron: '17 5 */3 * *'   # alle 3 Tage
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" && echo "Supabase ist wach"
      - uses: actions/checkout@v4
      - name: Monatlicher Commit (verhindert, dass GitHub den Zeitplan nach 60 Tagen abschaltet)
        run: |
          if [ "$(date +%d)" -le 3 ]; then
            date -u > .github/last-keepalive
            git config user.name "dartsportz-bot"; git config user.email "bot@users.noreply.github.com"
            git add .github/last-keepalive && git commit -m "keepalive $(date -u +%F)" && git push || true
          fi
